apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-blue
  labels:
    app: taskflow
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      color: blue
  template:
    metadata:
      labels:
        app: taskflow
        color: blue
    spec:
      containers:
        - name: app
          image: localhost:5000/taskflow-api:init
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-blue
spec:
  selector:
    app: taskflow
    color: blue
  ports:
    - port: 8080
      targetPort: 8080
